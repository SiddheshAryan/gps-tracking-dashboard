<!DOCTYPE html>
<html>

<head>

<title>Set Password</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(120deg,#c8f7dc,#cbe8ff);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:40px;
border-radius:12px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

input{
width:250px;
padding:10px;
margin-top:10px;
}

button{
padding:10px 20px;
margin-top:15px;
border:none;
border-radius:8px;
background:#4fa3ff;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Set Password</h2>

<p id="nameDisplay"></p>

<input type="password" id="password" placeholder="Enter Password"><br>

<button onclick="save()">Save</button>

</div>

<script>

const name=localStorage.getItem("facultyName")

document.getElementById("nameDisplay").innerText="Faculty: "+name

async function save(){

const password=document.getElementById("password").value

await fetch("/setFacultyPassword",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name,password})
})

alert("Faculty Registered Successfully")

window.location.href="index.html"

}

</script>

</body>

</html>
