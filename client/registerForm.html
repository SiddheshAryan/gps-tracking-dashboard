<!DOCTYPE html>
<html>
<head>

<title>Register - Safety Tracker</title>

<style>

body{
margin:0;
font-family:Arial;
background: linear-gradient(120deg,#c8f7dc,#cbe8ff);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:40px;
border-radius:12px;
text-align:center;
box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

input{
width:260px;
padding:10px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:10px 20px;
margin-top:15px;
border:none;
border-radius:8px;
background:#4fa3ff;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Student Registration</h2>

<input id="name" placeholder="Student Name"><br>

<input id="roll" placeholder="Roll Number"><br>

<input id="parentName" placeholder="Parent Name"><br>

<input id="phone" placeholder="Parent Phone"><br>

<input type="password" id="password" placeholder="Password"><br>

<button onclick="register()">Register</button>

</div>

<script>

async function register(){

const name = document.getElementById("name").value
const roll = document.getElementById("roll").value
const parentName = document.getElementById("parentName").value
const phone = document.getElementById("phone").value
const password = document.getElementById("password").value

if(!name || !roll || !parentName || !phone || !password){
alert("Please fill all fields")
return
}

const response = await fetch("/register",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:name,
roll:roll,
parentName:parentName,
phone:phone,
password:password
})
})

const result = await response.text()

alert(result)

if(result === "Registration successful"){
window.location.href="login.html"
}

}

</script>

</body>
</html>
