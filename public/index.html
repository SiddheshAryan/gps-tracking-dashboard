<!DOCTYPE html>
<html>
<head>

<title>Student Tracking System</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>

<body>

<h1>Student Tracking System</h1>

<div id="home">

<button onclick="showStudentLogin()">Student Login</button>

<button onclick="showStudentRegister()">Student Register</button>

<button onclick="showParentRegister()">Parent Register</button>

<button onclick="showTeacherRegister()">Teacher Register</button>

<button onclick="showParentTrack()">Parent Track</button>

<button onclick="showTeacherTrack()">Teacher Track</button>

</div>


<!-- STUDENT REGISTER -->

<div id="studentRegister" class="hidden">

<h2>Student Register</h2>

<input id="sname" placeholder="Name">

<input id="sroll" placeholder="Roll Number">

<input id="sfaculty" placeholder="Faculty Name">

<input id="sage" placeholder="Age">

<input id="sgender" placeholder="Gender">

<input id="spass" placeholder="Password">

<button onclick="registerStudent()">Register</button>

</div>


<!-- STUDENT LOGIN -->

<div id="studentLogin" class="hidden">

<h2>Student Login</h2>

<input id="lroll" placeholder="Roll Number">

<input id="lpass" placeholder="Password">

<button onclick="loginStudent()">Login</button>

<p id="status">Status: STOP</p>

<button class="startBtn" onclick="start()">START</button>

<button class="stopBtn" onclick="stop()">STOP</button>

</div>


<!-- PARENT REGISTER -->

<div id="parentRegister" class="hidden">

<h2>Parent Register</h2>

<input id="pname" placeholder="Parent Name">

<input id="childName" placeholder="Student Name">

<input id="croll" placeholder="Roll Number">

<input id="pmobile" placeholder="Mobile">

<button onclick="registerParent()">Register</button>

</div>


<!-- TEACHER REGISTER -->

<div id="teacherRegister" class="hidden">

<h2>Teacher Register</h2>

<input id="tname" placeholder="Teacher Name">

<input id="tfaculty" placeholder="Faculty">

<input id="tmobile" placeholder="Mobile">

<button onclick="registerTeacher()">Register</button>

</div>


<!-- PARENT TRACK -->

<div id="parentTrack" class="hidden">

<h2>Track Child</h2>

<input id="trackRoll" placeholder="Roll Number">

<button onclick="track()">Track</button>

<div id="map"></div>

</div>


<!-- TEACHER TRACK -->

<div id="teacherTrack" class="hidden">

<h2>Teacher Dashboard</h2>

<input id="facultySearch" placeholder="Faculty">

<button onclick="loadStudents()">Load Students</button>

<select id="studentDropdown"></select>

<button onclick="trackSelected()">Track Student</button>

<div id="map2"></div>

</div>


<script src="script.js"></script>

</body>
</html>
