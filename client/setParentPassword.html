<!DOCTYPE html>
<html>
<head>
<title>Set Password</title>
</head>

<body style="background:linear-gradient(120deg,#c8f7dc,#cbe8ff);display:flex;justify-content:center;align-items:center;height:100vh;">

<div style="background:white;padding:40px;border-radius:10px;text-align:center;">

<h2>Set Password</h2>

<p id="rollDisplay"></p>

<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="save()">Save</button>

</div>

<script>

const roll=localStorage.getItem("roll")

document.getElementById("rollDisplay").innerText="Roll Number: "+roll

async function save(){

const password=document.getElementById("password").value

await fetch("/setParentPassword",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({studentRoll:roll,password})
})

alert("Parent Registered")

window.location.href="index.html"

}

</script>

</body>
</html>
