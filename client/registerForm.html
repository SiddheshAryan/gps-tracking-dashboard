<!DOCTYPE html>
<html>

<head>

<title>Register Form - Safety Tracker</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(120deg,#c8f7dc,#cbe8ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:40px;
    border-radius:12px;
    text-align:center;
    box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

input{
    width:250px;
    padding:10px;
    margin-top:10px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    padding:10px 20px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#4fa3ff;
    color:white;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Register</h2>

<input id="name" placeholder="Enter Name"><br>

<input id="roll" placeholder="Enter Roll / ID"><br>

<input type="password" id="password" placeholder="Enter Password"><br>

<button onclick="register()">Register</button>

</div>

<script>

async function register(){

const name = document.getElementById("name").value
const roll = document.getElementById("roll").value
const password = document.getElementById("password").value

if(name==="" || roll==="" || password===""){
alert("Please fill all fields")
return
}

const response = await fetch("/register",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:name,
roll:roll,
password:password
})
})

const result = await response.text()

alert(result)

if(result === "Registration successful"){
window.location.href="login.html"
}

}

</script>

</body>

</html>
