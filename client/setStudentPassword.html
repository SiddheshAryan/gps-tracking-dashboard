<!DOCTYPE html>
<html>
<head>

<title>Set Password</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(120deg,#c8f7dc,#cbe8ff);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:40px;
border-radius:12px;
text-align:center;
}

input{
width:250px;
padding:10px;
margin-top:10px;
}

</style>

</head>

<body>

<div class="box">

<h2>Set Password</h2>

<p id="rollDisplay"></p>

<input type="password" id="password" placeholder="Enter Password"><br>

<button onclick="save()">Save</button>

</div>

<script>

const roll=localStorage.getItem("roll")

document.getElementById("rollDisplay").innerText="Roll Number: "+roll

async function save(){

const password=document.getElementById("password").value

await fetch("/setStudentPassword",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({roll,password})
})

alert("Registration Complete")

window.location.href="index.html"

}

</script>

</body>
</html>
